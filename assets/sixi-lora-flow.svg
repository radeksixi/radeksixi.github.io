<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Off-grid LoRa mesh &amp; authenticated field communications — sign, route, operate, observe, edge AI</title>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .core { fill: #fff8f0; stroke: #e36209; stroke-width: 2; }
    .step { fill: #57606a; font-size: 12px; font-weight: 600; letter-spacing: .12em; }
    .q { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .repo { fill: #0969da; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .note { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 22px; font-weight: 700; }
    .sub { fill: #57606a; font-size: 14px; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .kpi { fill: #1f2328; font-size: 26px; font-weight: 700; }
    .kpil { fill: #57606a; font-size: 12px; }
    .accent { fill: #e36209; }
    .rule { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .core { fill: #1f1610; stroke: #f0883e; }
      .step, .note, .sub, .kpil { fill: #8d96a0; }
      .q, .title, .kpi { fill: #e6edf3; }
      .repo { fill: #4493f8; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .accent { fill: #f0883e; }
      .rule { stroke: #30363d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="400" rx="12"/>

  <text class="title" x="32" y="46">Sixi <tspan class="accent">·</tspan> off-grid LoRa mesh &amp; authenticated field communications</text>
  <text class="sub" x="32" y="70">When power and mobile networks go down: sign public alerts, route across pocket radios, and verify every message offline.</text>

  <!-- five stages -->
  <g>
    <rect class="core" x="32" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="48" y="122">1 · SIGN</text>
    <text class="q" x="48" y="146">Authentic alerts</text>
    <text class="repo" x="48" y="174">sigillo</text>
    <text class="note" x="48" y="196">signed public alert in</text>
    <text class="note" x="48" y="212">one 87-byte radio frame</text>
    <text class="note" x="48" y="236">C99 · Python · TS</text>
  </g>
  <path class="arrow" d="M198,171 L214,171" marker-end="url(#a)"/>

  <g>
    <rect class="card" x="218" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="234" y="122">2 · ROUTE</text>
    <text class="q" x="234" y="146">No cell towers</text>
    <text class="repo" x="234" y="174">MeshCore</text>
    <text class="note" x="234" y="196">hops across solar nodes</text>
    <text class="note" x="234" y="218">respects regional radio</text>
    <text class="note" x="234" y="234">power &amp; airtime rules</text>
  </g>
  <path class="arrow" d="M384,171 L400,171" marker-end="url(#a)"/>

  <g>
    <rect class="core" x="404" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="420" y="122">3 · OPERATE</text>
    <text class="q" x="420" y="146">Handheld &amp; PC app</text>
    <text class="repo" x="420" y="174">sixi-tdeck-plus</text>
    <text class="note" x="420" y="196">Faro touch handheld UI</text>
    <text class="note" x="420" y="218">&amp; Linux desktop app,</text>
    <text class="note" x="420" y="234">live mesh map &amp; range</text>
  </g>
  <path class="arrow" d="M570,171 L586,171" marker-end="url(#a)"/>

  <g>
    <rect class="card" x="590" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="606" y="122">4 · OBSERVE</text>
    <text class="q" x="606" y="146">Monitor the air</text>
    <text class="repo" x="606" y="174">sixi-observer</text>
    <text class="note" x="606" y="196">LoRa &amp; SDR receiver</text>
    <text class="note" x="606" y="218">checks node signatures,</text>
    <text class="note" x="606" y="234">maps repeater paths</text>
  </g>
  <path class="arrow" d="M756,171 L772,171" marker-end="url(#a)"/>

  <g>
    <rect class="card" x="776" y="96" width="152" height="150" rx="10"/>
    <text class="step" x="792" y="122">5 · EDGE AI</text>
    <text class="q" x="792" y="146">Local edge AI</text>
    <text class="repo" x="792" y="174">GlassBoxEdge</text>
    <text class="note" x="792" y="196">NVIDIA Jetson nodes</text>
    <text class="note" x="792" y="218">reads live site sensors,</text>
    <text class="note" x="792" y="234">air-gapped, no cloud</text>
  </g>

  <!-- loop back -->
  <path class="arrow" d="M852,248 L852,262 Q852,268 846,268 L122,268 Q116,268 116,262 L116,252" marker-end="url(#a)" stroke-dasharray="4 4"/>
  <text class="note" x="220" y="290">every radio node verifies signatures offline — even without internet, GPS, or a real-time clock</text>

  <!-- KPIs -->
  <line class="rule" x1="32" y1="300" x2="928" y2="300"/>
  <text class="kpil" x="32" y="324">Complete open-source off-grid stack · sigillo · Faro (sixi-tdeck-plus) · sixi-observer · GlassBoxEdge</text>
  <g>
    <text class="kpi" x="32" y="366">87 bytes</text><text class="kpil" x="32" y="384">signed public alert packet</text>
    <text class="kpi" x="216" y="366">3 languages</text><text class="kpil" x="216" y="384">C99 · Python · TypeScript</text>
    <text class="kpi" x="412" y="366">Handheld + PC</text><text class="kpil" x="412" y="384">touchscreen UI &amp; Linux app</text>
    <text class="kpi" x="624" y="366">Live radio</text><text class="kpil" x="624" y="384">USB LoRa &amp; SDR receiver</text>
    <text class="kpi" x="784" y="366">Offline</text><text class="kpil" x="784" y="384">100% · zero cloud needed</text>
  </g>
</svg>
