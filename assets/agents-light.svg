<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="860" height="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="16 agents, 17.8k-token prompt each: wait for the next turn">
<title>16 agents, 17.8k-token prompt each: wait for the next turn</title><desc>Every agent loads its own document, then asks two follow-up questions while other agents are still loading. Time to first token.</desc>
