  <text x="722" y="408" fill="#d97706" font-size="68" font-weight="800">12.0 min</text>
  <text x="722" y="442" fill="#475569" font-size="21">timed out at 720 s · 887k target tokens (8×)</text>

  <line x1="722" y1="474" x2="1198" y2="474" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="722" y="520" fill="#475569" font-size="18" font-weight="700">SERVER ORACLES HIT (UNDEFENDED)</text>
