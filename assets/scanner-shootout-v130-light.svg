  <text x="116" y="442" fill="#475569" font-size="21">timed out at 720 s on undefended (56 turns)</text>

  <line x1="116" y1="474" x2="592" y2="474" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="116" y="520" fill="#475569" font-size="18" font-weight="700">SERVER ORACLES HIT (UNDEFENDED)</text>
