  <text x="1328" y="750" fill="#475569" font-size="18" font-weight="700">CLOSED LOOP (--export-laya)</text>
  <rect x="1328" y="766" width="468" height="60" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="1562" y="803" text-anchor="middle" fill="#059669" font-size="22" font-weight="700">7/7 verify-sixi closed · 0 oracles on DiD</text>

  <!-- Bottom takeaway -->
  <rect x="80" y="900" width="1760" height="84" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="80" y="900" width="8" height="84" rx="4" fill="#ea580c"/>
  <text x="114" y="936" fill="#0f172a" font-size="23" font-weight="700">Why wire-trace inspection wins: Qwen3.8-27B sent an external email via raw Base64, then replied "I can't do that."</text>
  <text x="114" y="968" fill="#475569" font-size="19">Prose-only judges score polite refusals as safe. sixi-scanner v1.3.0 flags forbidden SQL tables, BOLA, and external emails directly on tool_calls.</text>

  <text x="80" y="1036" fill="#64748b" font-size="18">Radek Brus · sixi.ai · pip install sixi-scanner laya-as-judge</text>
