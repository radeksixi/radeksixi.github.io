<text x="48" y="216" fill="#e6edf3" font-size="11.8">• Typed <tspan font-family="ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace">noul</tspan> (bool), <tspan font-family="ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace">choice</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', monospace">score</tspan></text>
