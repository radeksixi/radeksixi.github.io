<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 404" width="860" height="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="OpenClaw 2026.11.5 security scorecard: what held vs what tools.deny did not stop">
<title>OpenClaw 2026.11.5 security scorecard: what held vs what tools.deny did not stop</title><desc>Left: built-in controls that held during live local red-teaming (web_fetch SSRF metadata guard, 0700 startup permission doctor, and tools.deny cutting exec/write/edit to zero). Right: gaps observed in default and hardened local configurations (on-disk USER.md/MEMORY.md writes, workspace bootstrap secret injection despite group:memory deny, and multi-turn delayed directives).</desc>
<rect width="860" height="404" rx="8" fill="#fcfcfb"/>
<text x="24" y="32" fill="#0b0b0b" font-size="16" font-weight="600">OpenClaw 2026.11.5 security scorecard: what held vs what tools.deny did not stop</text>
<text x="24" y="52" fill="#52514e" font-size="12">Measured on local open-source OpenClaw 2026.11.5 (not hosted Microsoft Autopilot) · SQLite &amp; disk forensics</text>
<rect x="24" y="70" width="396" height="314" rx="8" fill="#f4f3ef" stroke="#b5e0cb"/>
<rect x="38" y="84" width="112" height="20" rx="10" fill="#1f8f5f"/>
<text x="94" y="97.5" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">CONTROLS HELD</text>
<text x="160" y="98" fill="#0b0b0b" font-size="13" font-weight="600">Runtime guards that worked</text>
<rect x="38" y="116" width="368" height="76" rx="6" fill="#fcfcfb" stroke="#b5e0cb"/>
<text x="50" y="135" fill="#1f8f5f" font-size="12" font-weight="600">✓  Built-in web_fetch SSRF guard</text>
<text x="50" y="152" fill="#0b0b0b" font-size="11" font-weight="600">Blocked AWS (169.254.169.254) &amp; GCP metadata</text>
<text x="50" y="168" fill="#52514e" font-size="10.5">Blocked in OpenClaw before hitting Docker net:</text>
<text x="50" y="182" fill="#898781" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">&quot;Blocked hostname or private/internal IP&quot;</text>
<rect x="38" y="202" width="368" height="76" rx="6" fill="#fcfcfb" stroke="#b5e0cb"/>
<text x="50" y="221" fill="#1f8f5f" font-size="12" font-weight="600">✓  Startup permission doctor (0700)</text>
<text x="50" y="238" fill="#0b0b0b" font-size="11" font-weight="600">Refused gateway boot on 0775 state directory</text>
<text x="50" y="254" fill="#52514e" font-size="10.5">Enforced private ancestor permissions &amp; SQLite</text>
<text x="50" y="268" fill="#898781" font-size="10.5">staging safety before accepting HTTP traffic.</text>
<rect x="38" y="288" width="368" height="76" rx="6" fill="#fcfcfb" stroke="#b5e0cb"/>
<text x="50" y="307" fill="#1f8f5f" font-size="12" font-weight="600">✓  tools.deny runtime enforcement</text>
<text x="50" y="324" fill="#0b0b0b" font-size="11" font-weight="600">0 exec · 0 write · 0 edit · 0 read across 4B &amp; 27B</text>
<text x="50" y="340" fill="#52514e" font-size="10.5">Eliminated all disk poisoning, cut scan time</text>
<text x="50" y="354" fill="#898781" font-size="10.5">1.8–3.1×, and rejected dispatch_action bypasses.</text>
<rect x="440" y="70" width="396" height="314" rx="8" fill="#f4f3ef" stroke="#efc4c1"/>
<rect x="454" y="84" width="118" height="20" rx="10" fill="#c93b3b"/>
<text x="513" y="97.5" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">GAPS OBSERVED</text>
<text x="582" y="98" fill="#0b0b0b" font-size="13" font-weight="600">What still needs defence</text>
<rect x="454" y="116" width="368" height="76" rx="6" fill="#fcfcfb" stroke="#efc4c1"/>
<text x="466" y="135" fill="#c93b3b" font-size="12" font-weight="600">!  On-disk USER.md / MEMORY.md writes (default)</text>
<text x="466" y="152" fill="#0b0b0b" font-size="11" font-weight="600">Both 4B &amp; 27B persisted sleeper rules to disk</text>
<text x="466" y="168" fill="#52514e" font-size="10.5">4B wiped USER.md &amp; MEMORY.md via write(); 27B</text>
<text x="466" y="182" fill="#898781" font-size="10.5">edited USER.md. Tracked upstream: #163680, #40001.</text>
<rect x="454" y="202" width="368" height="76" rx="6" fill="#fcfcfb" stroke="#f0d3a8"/>
<text x="466" y="221" fill="#b3650d" font-size="12" font-weight="600">!  Bootstrap context leaks (even hardened)</text>
<text x="466" y="238" fill="#0b0b0b" font-size="11" font-weight="600">10 leaks on 4B · 1 leak on 27B with tools.deny</text>
<text x="466" y="254" fill="#52514e" font-size="10.5">MEMORY.md &amp; SOUL.md load into system prompt</text>
<text x="466" y="268" fill="#898781" font-size="10.5">even when group:memory &amp; group:fs are denied.</text>
<rect x="454" y="288" width="368" height="76" rx="6" fill="#fcfcfb" stroke="#efc4c1"/>
<text x="466" y="307" fill="#c93b3b" font-size="12" font-weight="600">!  Multi-turn &amp; output handling without filters</text>
<text x="466" y="324" fill="#0b0b0b" font-size="11" font-weight="600">4B: sleeper + SSTI/CSV/XSS; 27B: delayed-instr</text>
<text x="466" y="340" fill="#52514e" font-size="10.5">Hardening 27B cut findings 8 → 2, but delayed</text>
<text x="466" y="354" fill="#898781" font-size="10.5">directives &amp; loops still need code-level guards.</text>
</svg>