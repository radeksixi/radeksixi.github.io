<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>sixi-asi: C++20/CUDA hybrid MoE &amp; Gated DeltaNet inference engine — bind, plan, execute, draft, serve</title>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .core { fill: #fff8f0; stroke: #e36209; stroke-width: 2; }
    .step { fill: #57606a; font-size: 12px; font-weight: 600; letter-spacing: .12em; }
    .q { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .repo { fill: #0969da; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .note { fill: #57606a; font-size: 12px; }
    .title { fill: #1f2328; font-size: 22px; font-weight: 700; }
    .sub { fill: #57606a; font-size: 14px; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .kpi { fill: #1f2328; font-size: 26px; font-weight: 700; }
    .kpil { fill: #57606a; font-size: 12px; }
    .accent { fill: #e36209; }
    .rule { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .core { fill: #1f1610; stroke: #f0883e; }
      .step, .note, .sub, .kpil { fill: #8d96a0; }
      .q, .title, .kpi { fill: #e6edf3; }
      .repo { fill: #4493f8; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .accent { fill: #f0883e; }
      .rule { stroke: #30363d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="400" rx="12"/>

  <text class="title" x="32" y="46">sixi-asi <tspan class="accent">·</tspan> C++20/CUDA hybrid MoE &amp; Gated DeltaNet engine</text>
  <text class="sub" x="32" y="70">Deterministic, memory-bounded LLM inference for hybrid linear-attention (GDN) &amp; sparse MoE — zero Python in the path.</text>

  <!-- five stages -->
  <g>
    <rect class="card" x="32" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="48" y="122">1 · BIND</text>
    <text class="q" x="48" y="146">Lock GGUF shards</text>
    <text class="repo" x="48" y="174">.sixi + .sixi.idx</text>
    <text class="note" x="48" y="194">SHA-256 recipe hash</text>
    <text class="note" x="48" y="220">hardened GGUF v2/v3</text>
    <text class="note" x="48" y="236">4096 B O_DIRECT I/O</text>
  </g>
  <path class="arrow" d="M198,171 L214,171" marker-end="url(#a)"/>

  <g>
    <rect class="core" x="218" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="234" y="122">2 · PLAN</text>
    <text class="q" x="234" y="146">Fit the VRAM cap</text>
    <text class="repo" x="234" y="174">MemoryPlanner</text>
    <text class="note" x="234" y="194">&lt; 20 GiB / &lt; 80 GiB</text>
    <text class="note" x="234" y="220">LRU/LFU expert cache</text>
    <text class="note" x="234" y="236">mmap / pinned PLE</text>
  </g>
  <path class="arrow" d="M384,171 L400,171" marker-end="url(#a)"/>

  <g>
    <rect class="card" x="404" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="420" y="122">3 · EXECUTE</text>
    <text class="q" x="420" y="146">Zero-drop kernels</text>
    <text class="repo" x="420" y="174">CUDA sm_110</text>
    <text class="repo" x="420" y="190">FP32 GDN state</text>
    <text class="note" x="420" y="218">top-k MoE (0 drops)</text>
    <text class="note" x="420" y="236">q8_1 &amp; nvfp4_fp32</text>
  </g>
  <path class="arrow" d="M570,171 L586,171" marker-end="url(#a)"/>

  <g>
    <rect class="core" x="590" y="96" width="164" height="150" rx="10"/>
    <text class="step" x="606" y="122">4 · DRAFT</text>
    <text class="q" x="606" y="146">Verify &amp; rollback</text>
    <text class="repo" x="606" y="174">Suffix + MTP</text>
    <text class="repo" x="606" y="190">n_rs_seq GDN ring</text>
    <text class="note" x="606" y="218">GPU greedy verifier</text>
    <text class="note" x="606" y="236">O(1) state rollback</text>
  </g>
  <path class="arrow" d="M756,171 L772,171" marker-end="url(#a)"/>

  <g>
    <rect class="card" x="776" y="96" width="152" height="150" rx="10"/>
    <text class="step" x="792" y="122">5 · SERVE</text>
    <text class="q" x="792" y="146">Native C++ API</text>
    <text class="repo" x="792" y="174">sixi-server</text>
    <text class="repo" x="792" y="190">sixi-cli · bench</text>
    <text class="note" x="792" y="218">HTTP/SSE · budgets</text>
    <text class="note" x="792" y="236">JSON tool validator</text>
  </g>

  <!-- loop back -->
  <path class="arrow" d="M852,248 L852,262 Q852,268 846,268 L122,268 Q116,268 116,262 L116,252" marker-end="url(#a)" stroke-dasharray="4 4"/>
  <text class="note" x="260" y="290">O(1) rollback across GDN + conv1d + KV + RNG states · bit-exact StrictReplay</text>

  <!-- KPIs -->
  <line class="rule" x1="32" y1="300" x2="928" y2="300"/>
  <text class="kpil" x="32" y="324">sixi-asi on NVIDIA Thor · Qwen3.8-27B (&lt; 20 GiB) &amp; Qwen3.8-Flash-Next 512-expert MoE (&lt; 80 GiB)</text>
  <g>
    <text class="kpi" x="32" y="366">+14.2%</text><text class="kpil" x="32" y="384">vs llama.cpp draft-mtp (5/5)</text>
    <text class="kpi" x="208" y="366">32.0 tok/s</text><text class="kpil" x="208" y="384">Flash-Next MoE peak (1.73x)</text>
    <text class="kpi" x="404" y="366">17.27 GiB</text><text class="kpil" x="404" y="384">27B GPU footprint (&lt; 20 GiB)</text>
    <text class="kpi" x="596" y="366">0 drops</text><text class="kpil" x="596" y="384">canonical FP32 · 100% lossless</text>
    <text class="kpi" x="776" y="366">0 Python</text><text class="kpil" x="776" y="384">native C++20 · CUDA sm_110</text>
  </g>
</svg>
