<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 248" width="960" height="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Sixi Lab R&amp;D — 1. sixi-asi v1.0.0 (Inference) → 2. laya-as-judge v1.0.0 (Decision &amp; Judge API) → 3. sixi-scanner v1.0.0 (Red-Teaming) · Sixi Assure &amp; Rifugio (sixi.ai)</title>
  <style>
    .bg { fill: #ffffff; }
    .core { fill: #fff8f0; stroke: #e36209; stroke-width: 1.8; }
    .radio { fill: #f4f8ff; stroke: #0969da; stroke-width: 1.8; }
    .title { fill: #1f2328; font-size: 20px; font-weight: 700; }
    .sub { fill: #57606a; font-size: 13.5px; }
    .accent { fill: #e36209; }
    .step { fill: #9a4405; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
    .step-b { fill: #0550ae; font-size: 11px; font-weight: 700; letter-spacing: .09em; }
    .name { fill: #1f2328; font-size: 17px; font-weight: 700; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .name-sans { fill: #1f2328; font-size: 16.5px; font-weight: 700; }
    .tag { fill: #57606a; font-size: 12px; font-weight: 500; }
    .stat { fill: #1f2328; font-size: 12.5px; font-weight: 600; }
    .note { fill: #57606a; font-size: 12px; }
    .arrow { stroke: #8c959f; stroke-width: 2; fill: none; }
    .head { fill: #8c959f; }
    .div { stroke: #d0d7de; stroke-width: 1.5; stroke-dasharray: 5 5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .core { fill: #1f1610; stroke: #f0883e; }
      .radio { fill: #0d1b2a; stroke: #4493f8; }
      .title, .name, .name-sans, .stat { fill: #e6edf3; }
      .sub, .tag, .note { fill: #8d96a0; }
      .accent, .step { fill: #f0883e; }
      .step-b { fill: #58a6ff; }
      .arrow { stroke: #6e7681; }
      .head { fill: #6e7681; }
      .div { stroke: #30363d; }
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="248" rx="12"/>

  <text class="title" x="24" y="38">Sixi Lab R&amp;D <tspan class="accent">·</tspan> Radek Brus</text>
  <text class="sub" x="24" y="60">Three open-source AI pillars — infer locally, evaluate with calibrated code, red-team in CI — plus Sixi Assure &amp; Rifugio at sixi.ai.</text>

  <!-- 1. sixi-asi -->
  <g>
    <rect class="core" x="24" y="78" width="212" height="148" rx="10"/>
    <text class="step" x="40" y="103">1 · INFER</text>
    <text class="name" x="40" y="128">sixi-asi</text>
    <text class="tag" x="40" y="148">C++20 · CUDA · v1.0.0</text>
    <text class="stat" x="40" y="176">55 tok/s · 46.0 vs TRT 45.4</text>
    <text class="note" x="40" y="196">32 streams @ 180 tok/s · 27 GB</text>
    <text class="note" x="40" y="213">Shared prompt 8 s vs 31 s · 0 Py</text>
  </g>
  <path class="arrow" d="M238,152 L251,152" marker-end="url(#arr)"/>

  <!-- 2. laya-as-judge -->
  <g>
    <rect class="core" x="254" y="78" width="212" height="148" rx="10"/>
    <text class="step" x="270" y="103">2 · DECIDE &amp; JUDGE</text>
    <text class="name" x="270" y="128">laya-as-judge</text>
    <text class="tag" x="270" y="148">3-Mode Local &amp; Omega · v1.0.0</text>
    <text class="stat" x="270" y="176">78.7% local $0 · 11/11 Omega</text>
    <text class="note" x="270" y="196">12/12 red-team · 0.0287 ECE</text>
    <text class="note" x="270" y="213">Decision · Judge · ActionGate</text>
  </g>
  <path class="arrow" d="M468,152 L481,152" marker-end="url(#arr)"/>

  <!-- 3. sixi-scanner -->
  <g>
    <rect class="core" x="484" y="78" width="212" height="148" rx="10"/>
    <text class="step" x="500" y="103">3 · RED-TEAM</text>
    <text class="name" x="500" y="128">sixi-scanner</text>
    <text class="tag" x="500" y="148">Static Go CLI · v1.0.0 · 0 deps</text>
    <text class="stat" x="500" y="176">0.821 prec · 1.000 multi-turn</text>
    <text class="note" x="500" y="196">45 probes · MCP/A2A · wire policy</text>
    <text class="note" x="500" y="213">Foundry + OpenClaw benchmarks</text>
  </g>

  <line class="div" x1="710" y1="82" x2="710" y2="222"/>

  <!-- 4. Sixi Assure & Rifugio (sixi.ai) -->
  <g>
    <rect class="radio" x="724" y="78" width="212" height="148" rx="10"/>
    <text class="step-b" x="740" y="103">SIXI LAB R&amp;D · SIXI.AI</text>
    <text class="name-sans" x="740" y="128">Assure &amp; Rifugio</text>
    <text class="tag" x="740" y="148">Agent governance &amp; Swiss LoRa</text>
    <text class="stat" x="740" y="176">Sixi Assure · handover packs</text>
    <text class="note" x="740" y="196">Rifugio · sigillo 87 B alerts</text>
    <text class="note" x="740" y="213">Faro v0.12.1 (T-Deck / MAX)</text>
  </g>
</svg>
